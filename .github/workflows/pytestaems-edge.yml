name: Python AEMS Edge Tests

on:
 [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install Poetry
      uses: snok/install-poetry@v1

    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'   # the Manager runs in a VOLTTRON 9 environment (Python ^3.10)

    #----------------------------------------------
    #       load cached venv if cache exists
    #----------------------------------------------
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    #----------------------------------------------
    # install dependencies if cache does not exist
    #----------------------------------------------
    - name: Install dependencies
      working-directory: aems-edge/Manager
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: |
        poetry install --no-interaction --no-root


    - name: Install dependencies
      working-directory: aems-edge/Manager
      run: |
        poetry install --with dev

    # The Manager imports volttron.platform; its tests need VOLTTRON installed,
    # as in the environment the agent runs in. pyzmq is installed by VOLTTRON's
    # bootstrap rather than its setup.py, so add it here.
    - name: Install VOLTTRON 9.0.4
      working-directory: aems-edge/Manager
      run: |
        poetry run pip install "volttron @ git+https://github.com/VOLTTRON/volttron.git@9.0.4" "pyzmq==26.0.2"

    - name: Run Pytest with Coverage
      working-directory: aems-edge/Manager
      run: |
         poetry run pytest --cov --cov-report html
         poetry run pytest --cov --cov-report term


    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4.6.0
      with:
        name: coverage-report
        path: aems-edge/Manager/htmlcov  # Assuming coverage report directory
